# JARVIS project registry
#
# Active WSL-native repositories should normally live under:
#   /home/hskim/projects/<project>
#
# The JARVIS repo should not contain project source trees. If a local root-level
# /home/hskim/jarvis/projects folder or symlink exists, it is ignored.
# Register project paths here instead, and create one git/GitHub repo per project.
#
# Existing Windows-side projects can be registered with /mnt/c paths when needed,
# but active Codex/OMX development is preferred inside WSL for performance and compatibility.

projects:
  jarvis:
    name: jarvis
    type: control-plane
    path: /home/hskim/jarvis
    repo: /home/hskim/jarvis
    wiki: /home/hskim/jarvis/wiki/projects/jarvis
    default_executor: hermes-direct
    status: active
    notes: Hermes/JARVIS central control-plane workspace.

  jarvis-executor-smoke:
    name: jarvis-executor-smoke
    type: test-harness
    path: /home/hskim/projects/jarvis-executor-smoke
    repo: /home/hskim/projects/jarvis-executor-smoke
    wiki: null
    default_executor: codex-exec
    status: active
    notes: WSL-native smoke-test repository for verifying JARVIS Codex/OMX routing boundaries.

  slide-harness:
    name: slide-harness
    type: presentation-harness
    path: /home/hskim/projects/slide-harness
    repo: /home/hskim/projects/slide-harness
    wiki: /home/hskim/jarvis/wiki/projects/slide-harness
    default_executor: omx-ralph
    status: active
    notes: HTML-first slide generation harness with Claude Design-style renderer, requirements gate, PDF export, and QA loop.
