# JARVIS project registry
#
# Active WSL-native repositories should normally live under:
#   ~/projects/<project>
#
# The JARVIS repo should not contain project source trees. If a local root-level
# ~/jarvis/projects folder or symlink exists, it is ignored.
# Register project paths here instead, and create one git/GitHub repo per project.
#
# Existing Windows-side projects can be registered with /mnt/c paths when needed,
# but active Codex/OMX development is preferred inside WSL for performance and compatibility.

projects:
  jarvis:
    name: jarvis
    type: control-plane
    path: ~/jarvis
    repo: ~/jarvis
    wiki: ~/jarvis/wiki/projects/jarvis
    default_executor: hermes-direct
    status: active
    notes: Hermes/JARVIS central control-plane workspace.

  jarvis-executor-smoke:
    name: jarvis-executor-smoke
    type: test-harness
    path: ~/projects/jarvis-executor-smoke
    repo: ~/projects/jarvis-executor-smoke
    wiki: null
    default_executor: codex-exec
    status: active
    notes: WSL-native smoke-test repository for verifying JARVIS Codex/OMX routing boundaries.

  slide-harness:
    name: slide-harness
    type: presentation-harness-legacy
    path: ~/projects/slide-harness
    repo: ~/projects/slide-harness
    wiki: ~/jarvis/wiki/projects/slide-harness
    default_executor: hermes-direct
    status: legacy-reference
    notes: Completed/legacy HTML-first slide generation harness and dashboard experiment; preserved as reference while hermes-slide-director is the active slide-production direction.

  hermes-slide-director:
    name: hermes-slide-director
    type: presentation-agent-harness-closed
    path: ~/projects/hermes-slide-director
    repo: ~/projects/hermes-slide-director
    remote: https://github.com/Han43seong/hermes-slide-director.git
    wiki: ~/jarvis/wiki/projects/hermes-slide-director
    default_executor: hermes-direct
    status: closed-archived
    notes: Definitively closed after Phase 42; retained only as historical reference and learning record. Do not route new slide-production work here.

  SlideForge:
    name: SlideForge
    type: presentation-asset-pipeline
    path: ~/projects/SlideForge
    repo: ~/projects/SlideForge
    remote: https://github.com/Han43seong/SlideForge.git
    wiki: ~/jarvis/wiki/projects/SlideForge
    default_executor: omx-ralph
    status: active
    notes: Active clean-start slide design pipeline using JARVIS design planning, ComfyUI asset forge, codex-guizang-html primary composition, and codex-presentation-pptx delivery.

  S1000D-RAG:
    name: S1000D-RAG
    type: rag-application
    path: ~/projects/S1000D-RAG
    repo: ~/projects/S1000D-RAG
    remote: https://github.com/Han43seong/S1000D-RAG.git
    wiki: ~/jarvis/wiki/projects/S1000D-RAG
    default_executor: omx-ralph
    status: reference-complete
    notes: S1000D RDF/AnswerPlan Graph RAG reference implementation; closed for new MRO-specific feature work after pivot to internal business-document chatbot.

  example-private-project:
    name: example-private-project
    type: private-application
    path: ~/projects/example-private-project
    repo: ~/projects/example-private-project
    remote: null
    wiki: null
    default_executor: omx-ralph
    status: example-only
    notes: Placeholder showing how to register a private project without publishing its metadata.
